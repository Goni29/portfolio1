{% extends "base.html" %}
{% block title %}관리자 로그인 | Portfolio{% endblock %}

{% block content %}
<section class="page-section bg-light" style="padding-top:8rem;">
  <div class="container" style="max-width:520px;">
    <div class="p-4 border rounded-4 bg-white">
      <h3 class="mb-2">관리자 로그인</h3>
      <p class="text-muted mb-4">아이디/비밀번호를 입력하세요.</p>

      {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="alert alert-danger">{{ msg }}</div>
        {% endfor %}
      {% endif %}
      {% endwith %}

      <form method="post">
        <div class="mb-3">
          <input class="form-control" name="username" placeholder="아이디" required>
        </div>
        <div class="mb-3">
          <input class="form-control" name="password" type="password" placeholder="비밀번호" required>
        </div>
        <button class="btn btn-dark w-100" type="submit">로그인</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
